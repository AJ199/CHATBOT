version: "3.8"
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env.sample
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_BACKEND_URL=http://localhost:8000
    restart: unless-stopped
